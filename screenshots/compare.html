<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Before / after</title>
<style>body{margin:0;background:#0f1012;color:#e9e9ed;font:15px/1.5 system-ui,sans-serif;padding:24px 16px}h1{font-size:20px;margin:0 0 4px}h2{font-size:14px;text-transform:uppercase;letter-spacing:.08em;color:#9d9da6;margin:32px 0 10px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}.pair.m{grid-template-columns:repeat(4,1fr)}figure{margin:0}img{width:100%;border:1px solid #2a2b30;border-radius:8px;display:block}figcaption{color:#9d9da6;font-size:13px;margin-top:6px}
@media (max-width:800px){.pair,.pair.m{grid-template-columns:1fr}}</style></head><body>
<h1>Rhythm Trainer redesign</h1><p style="color:#9d9da6;margin:0">Before (left) and after (right). Same default state; the "settings" shots have the Settings button pressed.</p>
<h2>Desktop</h2><div class="pair"><figure><img src="before-desktop.png"><figcaption>Before</figcaption></figure><figure><img src="after-desktop.png"><figcaption>After</figcaption></figure></div>
<h2>Desktop, settings open</h2><div class="pair"><figure><img src="before-desktop-settings.png"><figcaption>Before: pushes the game ~600px down</figcaption></figure><figure><img src="after-desktop-settings.png"><figcaption>After: side sheet, game doesn't move</figcaption></figure></div>
<h2>Mobile</h2><div class="pair m"><figure><img src="before-mobile.png"><figcaption>Before</figcaption></figure><figure><img src="before-mobile-settings.png"><figcaption>Before, settings</figcaption></figure><figure><img src="after-mobile.png"><figcaption>After</figcaption></figure><figure><img src="after-mobile-settings.png"><figcaption>After, settings (bottom sheet)</figcaption></figure></div>
</body></html>
